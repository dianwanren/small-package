  name: Sync selected packages

  on:
    schedule:
      - cron: '0 */6 * * *'   # 每 6 小时同步一次
    workflow_dispatch:          # 允许手动触发

  permissions:
    contents: write

  env:
    # 想同步哪些文件夹就写在这里，用空格分隔
    PACKAGES: "luci-theme-argon luci-app-argon-config luci-app-honk honk luci-app-momo luci-app-nikki momo nikki mihomo sing-box"

  jobs:
    sync:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: 只拉取指定文件夹
          run: |
            git clone --depth 1 --filter=blob:none --sparse https://github.com/kenzok8/small-package upstream
            cd upstream
            git sparse-checkout set $PACKAGES

        - name: 复制到本仓库
          run: |
            for p in $PACKAGES; do
              rm -rf "$p"
              cp -r "upstream/$p" "$p"
            done
            rm -rf upstream

        - name: 提交并推送
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git diff --cached --quiet || (git commit -m "sync: $(date '+%Y-%m-%d %H:%M')" && git push)
